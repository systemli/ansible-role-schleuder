---
argument_specs:
  main:
    short_description: Install and configure Schleuder (with schleuder-cli and GitLab ticketing plugin)
    description:
      - Installs Schleuder 5 and optionally schleuder-cli and the schleuder-gitlab-ticketing plugin from the Debian packages.
      - Many list settings are written verbatim into YAML and are therefore strings such as C("true") or C("false").
    options:
      schleuder_install_cli:
        type: bool
        description:
          - Install schleuder-cli.
      schleuder_install_gitlab_ticket_plugin:
        type: bool
        description:
          - Install the schleuder-gitlab-ticketing plugin.
      schleuder_schleuder_user:
        type: str
      schleuder_gpg_tor_keyserver:
        type: str
      schleuder_cli_api_host:
        type: str
      schleuder_cli_api_key:
        type: str
        description:
          - API key used by schleuder-cli. C(schleuder-cli.yml) is only written if this and C(schleuder_cli_api_tls_fingerprint) are set.
      schleuder_cli_api_port:
        type: int
      schleuder_cli_path:
        type: str
      schleuder_cli_api_tls_fingerprint:
        type: str
        description:
          - TLS fingerprint of the Schleuder API, see C(schleuder cert fingerprint).
      schleuder_api_host:
        type: str
      schleuder_api_port:
        type: int
      schleuder_api_tls_cert_file:
        type: str
      schleuder_api_tls_key_file:
        type: str
      schleuder_api_valid_api_keys:
        type: list
        elements: str
        description:
          - API keys which are allowed to access the API.
      schleuder_database:
        type: dict
        description:
          - Database configuration, written to C(schleuder.yml) as the C(production) environment.
      schleuder_lists_dir:
        type: str
      schleuder_listlogs_dir:
        type: str
      schleuder_filters_dir:
        type: str
      schleuder_log_level:
        type: str
      schleuder_keyword_handlers_dir:
        type: str
      schleuder_sks_keyserver:
        type: str
      schleuder_smtp_settings:
        type: dict
        description:
          - SMTP settings with the keys C(address) and C(port) and optionally C(domain), C(enable_starttls_auto), C(openssl_verify_mode), C(authentication),
            C(user_name), C(password).
      schleuder_superadmin:
        type: str
      schleuder_umask:
        type: raw
        description:
          - Umask as octal string such as C("0077").
      schleuder_vks_keyserver:
        type: str
      schleuder_send_encrypted_only:
        type: str
      schleuder_receive_encrypted_only:
        type: str
      schleuder_receive_signed_only:
        type: str
      schleuder_receive_authenticated_only:
        type: str
      schleuder_receive_from_subscribed_emailaddresses_only:
        type: str
      schleuder_receive_admin_only:
        type: str
      schleuder_headers_to_meta:
        type: list
        elements: str
      schleuder_keep_msgid:
        type: str
      schleuder_key_auto_import_from_email:
        type: str
      schleuder_keywords_admin_only:
        type: list
        elements: str
      schleuder_keywords_admin_notify:
        type: list
        elements: str
      schleuder_internal_footer:
        type: str
      schleuder_public_footer:
        type: str
      schleuder_subject_prefix:
        type: str
      schleuder_subject_prefix_in:
        type: str
      schleuder_subject_prefix_out:
        type: str
      schleuder_bounces_drop_all:
        type: str
      schleuder_bounces_drop_on_headers:
        type: dict
        description:
          - Mapping of header name to value on which bounces are dropped.
      schleuder_bounces_notify_admins:
        type: str
      schleuder_include_autocrypt_header:
        type: str
      schleuder_include_list_headers:
        type: str
      schleuder_include_openpgp_header:
        type: str
      schleuder_openpgp_header_preference:
        type: str
      schleuder_max_message_size_kb:
        type: int
      schleuder_lists_log_level:
        type: str
      schleuder_logfiles_to_keep:
        type: int
      schleuder_language:
        type: str
        choices:
          - en
          - de
      schleuder_forward_all_incoming_to_admins:
        type: str
      schleuder_deliver_selfsent:
        type: str
      schleuder_set_reply_to_to_sender:
        type: str
      schleuder_munge_from:
        type: str
      schleuder_gitlab_default_subject_filters:
        type: list
        elements: str
        description:
          - global settings
      schleuder_gitlab_default_sender_filters:
        type: list
        elements: str
      schleuder_gitlab_default_gitlab_connection:
        type: dict
        description:
          - Default GitLab connection with the keys C(endpoint) and C(token).
      schleuder_gitlab_lists:
        type: list
        elements: dict
        description:
          - "Settings per list: each item maps a list address to a dict with C(project), C(namespace), C(ticket_prefix), C(gitlab) (C(endpoint),
            C(token)), C(subject_filters) and C(sender_filters). See https://0xacab.org/schleuder/schleuder-gitlab-ticketing."
